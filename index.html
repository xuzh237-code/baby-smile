<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝成长记录助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
            background-color: #fcfcfc;
        }
        .card-shadow { box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02); }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        .manual-input-base {
            background-color: #f8fafc;
            border: 2px solid #f1f5f9;
            border-radius: 1rem;
            font-weight: 800;
            color: #1e293b;
            transition: all 0.2s;
            outline: none;
            text-align: center;
        }
        .manual-input-base:focus {
            background-color: white;
            border-color: #fbbf24;
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.1);
        }

        .manual-time-input { width: 100%; height: 52px; font-size: 1.1rem; }
        .manual-volume-input { width: 100%; height: 56px; font-size: 1.25rem; padding: 0 3.5rem 0 1.25rem; text-align: left; }

        .tab-group { display: flex; background: #f1f5f9; padding: 4px; border-radius: 0.8rem; }
        .tab-btn { flex: 1; padding: 8px; border-radius: 0.6rem; font-size: 0.85rem; font-weight: 600; color: #64748b; transition: all 0.2s; }
        .tab-btn.active-yellow { background: white; color: #b45309; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .tab-btn.active-green { background: white; color: #065f46; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .record-item { transition: all 0.2s; }
        .record-item:active { transform: scale(0.98); background-color: #f1f5f9; }

        .bottom-panel {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-top-left-radius: 2rem; border-top-right-radius: 2rem;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 51; padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.05);
        }
        #analysis-overlay, #edit-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px); z-index: 50; display: none;
        }

        .theme-yellow { color: #d97706; background-color: #fef3c7; border-color: #fbbf24; }
        .theme-green { color: #059669; background-color: #d1fae5; border-color: #34d399; }
        .theme-blue { color: #0284c7; background-color: #e0f2fe; border-color: #38bdf8; }

        .btn-yellow { background-color: #fbbf24; color: white; }
        .btn-green { background-color: #10b981; color: white; }
        .btn-blue { background-color: #0ea5e9; color: white; }

        .date-shifter { transition: all 0.3s ease; }
        .category-records-enter {
            animation: categoryRecordsEnter 0.22s ease;
            transform-origin: top;
        }
        @keyframes categoryRecordsEnter {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { color: #94a3b8; font-size: 10px; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-20 px-6 py-3">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center space-x-2">
                <div class="bg-amber-500 p-1.5 rounded-lg text-white">
                    <i data-lucide="baby" class="w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-black text-slate-800 tracking-tight">宝宝日志</h1>
            </div>
            <div class="flex space-x-1">
                <button onclick="openAnalysis()" class="p-2 text-slate-400 hover:text-amber-500"><i data-lucide="bar-chart-2" class="w-5 h-5"></i></button>
                <button onclick="document.getElementById('csv-upload').click()" class="p-2 text-slate-400 hover:text-emerald-600"><i data-lucide="upload" class="w-5 h-5"></i></button>
                <button onclick="exportData()" class="p-2 text-slate-400 hover:text-indigo-600"><i data-lucide="download" class="w-5 h-5"></i></button>
                <button onclick="clearAll()" class="p-2 text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div class="flex items-center justify-between bg-slate-100 p-1 rounded-2xl gap-2">
            <button onclick="shiftDate(-1)" class="p-2 hover:bg-white rounded-xl transition-all"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-400"></i></button>
            <div id="current-date-display" class="font-black text-slate-700 flex-1 flex flex-col items-center">
                <span class="text-sm" id="display-date-text">2023年10月27日</span>
                <span class="text-[9px] text-amber-600 font-bold tracking-widest uppercase" id="display-day-tag">今天</span>
            </div>
            <button id="jump-today-btn" onclick="jumpToToday()" class="px-3 py-2 text-[10px] font-black text-amber-600 bg-white rounded-xl shadow-sm transition-all hidden">今天</button>
            <button onclick="shiftDate(1)" class="p-2 hover:bg-white rounded-xl transition-all"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-400"></i></button>
        </div>
    </header>
    <input id="csv-upload" type="file" accept=".csv,text/csv" class="hidden" onchange="importData(event)">

    <main id="swipe-area" class="max-w-md mx-auto p-4 space-y-6">
        <section class="grid grid-cols-3 gap-3">
            <div class="bg-white p-4 rounded-3xl card-shadow border border-slate-50 flex flex-col items-center">
                <span class="text-[10px] font-bold text-slate-400 mb-1">当日奶量</span>
                <div class="flex items-baseline"><span id="stat-milk" class="text-xl font-black text-amber-500">0</span><span class="text-[10px] ml-0.5 text-amber-400">ml</span></div>
            </div>
            <div class="bg-white p-4 rounded-3xl card-shadow border border-slate-50 flex flex-col items-center">
                <span class="text-[10px] font-bold text-slate-400 mb-1">当日便便</span>
                <div class="flex items-baseline"><span id="stat-poop" class="text-xl font-black text-emerald-500">0</span><span class="text-[10px] ml-0.5 text-emerald-400">次</span></div>
            </div>
            <div class="bg-white p-4 rounded-3xl card-shadow border border-slate-50 flex flex-col items-center">
                <span class="text-[10px] font-bold text-slate-400 mb-1">当日睡眠</span>
                <div class="flex items-baseline"><span id="stat-sleep" class="text-xl font-black text-sky-500">0</span><span class="text-[10px] ml-0.5 text-sky-400">h</span></div>
            </div>
        </section>

        <section class="bg-white rounded-[2rem] p-6 card-shadow border border-slate-50 space-y-4">
            <div class="flex items-center space-x-2 text-amber-500">
                <i data-lucide="milk" class="w-5 h-5"></i>
                <h2 class="font-black text-slate-800">喝奶</h2>
            </div>
            <div class="tab-group">
                <button id="milk-type-breast" onclick="setMilkType('瓶喂母乳')" class="tab-btn active-yellow">瓶喂母乳</button>
                <button id="milk-type-formula" onclick="setMilkType('配方奶')" class="tab-btn">配方奶</button>
            </div>
            <div class="flex space-x-3">
                <div class="relative flex-1">
                    <input id="milk-volume" type="number" inputmode="numeric" placeholder="输入奶量" class="manual-input-base manual-volume-input">
                    <span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 font-bold">ml</span>
                </div>
                <button onclick="saveMilk()" class="btn-yellow px-8 rounded-2xl font-black shadow-lg shadow-amber-100 transition-transform active:scale-95">记录</button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 px-1">开始 (例 1030)</span>
                    <input type="text" inputmode="numeric" placeholder="HH:mm" id="milk-start-time" class="manual-input-base manual-time-input" onblur="formatTimeInput(this)">
                </div>
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 px-1">结束 (例 1045)</span>
                    <input type="text" inputmode="numeric" placeholder="HH:mm" id="milk-end-time" class="manual-input-base manual-time-input" onblur="formatTimeInput(this)">
                </div>
            </div>
        </section>

        <section class="bg-white rounded-[2rem] p-6 card-shadow border border-slate-50 space-y-4">
            <div class="flex items-center space-x-2 text-emerald-500">
                <i data-lucide="droplets" class="w-5 h-5"></i>
                <h2 class="font-black text-slate-800">排泄</h2>
            </div>
            <div class="tab-group" id="poop-type-group">
                <button onclick="setPoopType('尿尿')" class="tab-btn active-green">尿尿</button>
                <button onclick="setPoopType('便便')" class="tab-btn">便便</button>
                <button onclick="setPoopType('尿尿+便便')" class="tab-btn">都要</button>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex-1 space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 px-1">时间 (例 1420)</span>
                    <input type="text" inputmode="numeric" placeholder="HH:mm" id="poop-time" class="manual-input-base manual-time-input" onblur="formatTimeInput(this)">
                </div>
                <button onclick="savePoop()" class="btn-green px-8 h-[52px] mt-5 rounded-2xl font-black shadow-lg shadow-emerald-100 transition-transform active:scale-95">记录</button>
            </div>
        </section>

        <section class="bg-white rounded-[2rem] p-6 card-shadow border border-slate-50 space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2 text-sky-500">
                    <i data-lucide="moon" class="w-5 h-5"></i>
                    <h2 class="font-black text-slate-800">睡眠</h2>
                </div>
                <div class="flex items-center space-x-2 bg-slate-50 px-3 py-1.5 rounded-full">
                    <span class="text-[10px] font-bold text-slate-400">跨天</span>
                    <input type="checkbox" id="sleep-cross-day" class="w-4 h-4 rounded border-slate-300 text-sky-600">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 px-1">入睡 (例 2100)</span>
                    <input type="text" inputmode="numeric" placeholder="HH:mm" id="sleep-start-time" class="manual-input-base manual-time-input" onblur="formatTimeInput(this)">
                </div>
                <div class="space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 px-1">醒来 (例 0730)</span>
                    <input type="text" inputmode="numeric" placeholder="HH:mm" id="sleep-end-time" class="manual-input-base manual-time-input" onblur="formatTimeInput(this)">
                </div>
            </div>
            <button onclick="saveSleep()" class="w-full btn-blue h-14 rounded-2xl font-black shadow-lg shadow-sky-100 transition-transform active:scale-95">保存睡眠数据</button>
        </section>

        <section class="bg-white rounded-[2rem] p-6 card-shadow border border-slate-50 space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2 text-indigo-500">
                    <i data-lucide="pill" class="w-5 h-5"></i>
                    <h2 class="font-black text-slate-800">补剂</h2>
                </div>
                <span id="supplement-hint" class="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-3 py-1.5 rounded-full">建议今日补剂：AD</span>
            </div>
            <div class="tab-group">
                <button id="supplement-type-ad" onclick="setSupplementType('AD')" class="tab-btn active-yellow">AD</button>
                <button id="supplement-type-d3" onclick="setSupplementType('D3')" class="tab-btn">D3</button>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex-1 space-y-1">
                    <span class="text-[10px] font-bold text-slate-400 px-1">时间 (例 0900)</span>
                    <input type="text" inputmode="numeric" placeholder="HH:mm" id="supplement-time" class="manual-input-base manual-time-input" onblur="formatTimeInput(this)">
                </div>
                <button onclick="saveSupplement()" class="px-8 h-[52px] mt-5 rounded-2xl font-black shadow-lg transition-transform active:scale-95 bg-indigo-500 text-white shadow-indigo-100">记录</button>
            </div>
        </section>

        <div id="history-list" class="space-y-3 pb-10"></div>
    </main>

    <div id="analysis-overlay" onclick="closeAnalysis()"></div>
    <div id="analysis-panel" class="bottom-panel p-6 overflow-y-auto" style="max-height: 90vh;">
        <div class="flex justify-between items-center mb-6">
            <h3 id="analysis-title" class="text-lg font-black text-slate-800">趋势对比 (近7天)</h3>
            <button onclick="closeAnalysis()" class="p-2 bg-slate-100 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="space-y-8">
            <div class="tab-group">
                <button id="analysis-range-day" onclick="setAnalysisRange('day')" class="tab-btn active-yellow">近7天</button>
                <button id="analysis-range-week" onclick="setAnalysisRange('week')" class="tab-btn">周</button>
                <button id="analysis-range-month" onclick="setAnalysisRange('month')" class="tab-btn">月</button>
                <button id="analysis-range-quarter" onclick="setAnalysisRange('quarter')" class="tab-btn">季度</button>
                <button id="analysis-range-year" onclick="setAnalysisRange('year')" class="tab-btn">年</button>
            </div>
            <div class="space-y-2">
                <span id="analysis-chart-caption" class="text-xs font-bold text-slate-400">奶量 & 睡眠 (ml / h)</span>
                <div id="mixed-chart-container" class="h-44 w-full bg-slate-50 rounded-2xl p-4 flex items-end justify-between border border-slate-100"></div>
            </div>
            <div class="space-y-3">
                <span id="analysis-table-caption" class="text-xs font-bold text-slate-400">每日统计数据</span>
                <div class="overflow-hidden">
                    <table>
                        <thead>
                            <tr><th id="analysis-first-col">日期</th><th>奶量</th><th>便便</th><th>睡眠</th></tr>
                        </thead>
                        <tbody id="analysis-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="edit-overlay" onclick="closeEditPanel()"></div>
    <div id="edit-panel" class="bottom-panel p-6">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-lg font-black text-slate-800">修改记录</h3>
            <button onclick="deleteCurrentRecord()" class="text-red-500 flex items-center space-x-1 text-sm font-bold"><i data-lucide="trash-2" class="w-4 h-4"></i><span>删除</span></button>
        </div>
        <div id="edit-form-content" class="space-y-5"></div>
        <div class="flex space-x-3 mt-8">
            <button onclick="closeEditPanel()" class="flex-1 h-14 bg-slate-100 text-slate-500 rounded-2xl font-black">取消</button>
            <button onclick="updateRecord()" id="edit-confirm-btn" class="flex-1 h-14 text-white rounded-2xl font-black">确认修改</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-6 py-3 rounded-2xl text-xs font-bold opacity-0 transition-all z-[100] pointer-events-none"></div>

    <script>
        lucide.createIcons();

        let records = JSON.parse(localStorage.getItem('baby_records_v13')) || [];
        let viewDate = new Date();
        let curMilkType = '瓶喂母乳';
        let curPoopType = '尿尿';
        let curSupplementType = 'AD';
        let editingRecordId = null;
        let analysisRange = 'day';
        let collapsedCategories = {};

        let touchStartX = 0;
        const swipeArea = document.getElementById('swipe-area');
        swipeArea.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        swipeArea.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 80) shiftDate(1);
            if (touchEndX - touchStartX > 80) shiftDate(-1);
        });

        function shiftDate(offset) {
            viewDate.setDate(viewDate.getDate() + offset);
            updateDateUI();
            setDefaultTimes();
            render();
        }

        function jumpToToday() {
            viewDate = new Date();
            updateDateUI();
            setDefaultTimes();
            render();
        }

        function updateDateUI() {
            const today = new Date().toLocaleDateString();
            const current = viewDate.toLocaleDateString();
            const isToday = today === current;

            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('display-date-text').innerText = viewDate.toLocaleDateString('zh-CN', options);

            const tag = document.getElementById('display-day-tag');
            if(isToday) {
                tag.innerText = "今天";
                tag.className = "text-[9px] text-amber-600 font-bold tracking-widest uppercase";
            } else {
                const days = ['周日','周一','周二','周三','周四','周五','周六'];
                tag.innerText = days[viewDate.getDay()];
                tag.className = "text-[9px] text-slate-400 font-bold tracking-widest uppercase";
            }

            const todayBtn = document.getElementById('jump-today-btn');
            if (todayBtn) {
                todayBtn.classList.toggle('hidden', isToday);
            }
        }

        function formatTimeInput(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length >= 3) {
                if (val.length === 3) val = '0' + val;
                const hh = val.slice(0, 2);
                const mm = val.slice(2, 4);
                if (parseInt(hh) > 23 || parseInt(mm) > 59) {
                    showToast('时间不合法');
                    input.value = '';
                    return;
                }
                input.value = `${hh}:${mm}`;
            }
        }

        function selectAllInputText(input) {
            if (!input || input.type === 'checkbox' || input.type === 'file') return;
            requestAnimationFrame(() => {
                input.select();
                if (typeof input.setSelectionRange === 'function') {
                    input.setSelectionRange(0, input.value.length);
                }
            });
        }

        function bindInputInteractions(root = document) {
            root.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
                if (input.dataset.boundInteractions === 'true') return;
                input.dataset.boundInteractions = 'true';
                input.addEventListener('focus', () => selectAllInputText(input));
                input.addEventListener('click', () => selectAllInputText(input));
            });
        }

        function focusNextInput(ids, currentId) {
            const currentIndex = ids.indexOf(currentId);
            if (currentIndex === -1 || currentIndex === ids.length - 1) return false;
            const nextInput = document.getElementById(ids[currentIndex + 1]);
            if (!nextInput) return false;
            nextInput.focus();
            return true;
        }

        function handleEnterSubmit(event) {
            if (event.key !== 'Enter') return;
            const target = event.target;
            if (!target || target.tagName !== 'INPUT') return;
            if (target.type === 'checkbox' || target.type === 'file') return;

            event.preventDefault();
            if (target.classList.contains('manual-time-input')) {
                formatTimeInput(target);
            }

            if (editingRecordId !== null && document.getElementById('edit-overlay').style.display === 'block') {
                const editMilkIds = ['edit-val', 'edit-s-time', 'edit-e-time'];
                const editPoopIds = ['edit-t-time'];
                const editSupplementIds = ['edit-t-time'];
                const editSleepIds = ['edit-s-time', 'edit-e-time'];

                if (editMilkIds.includes(target.id)) {
                    if (!focusNextInput(editMilkIds, target.id)) updateRecord();
                    return;
                }

                if (editPoopIds.includes(target.id)) {
                    updateRecord();
                    return;
                }

                if (editSupplementIds.includes(target.id) && document.getElementById('edit-supplement-ad')) {
                    updateRecord();
                    return;
                }

                if (editSleepIds.includes(target.id)) {
                    if (!focusNextInput(editSleepIds, target.id)) updateRecord();
                    return;
                }

                return;
            }

            const milkIds = ['milk-volume', 'milk-start-time', 'milk-end-time'];
            if (milkIds.includes(target.id)) {
                if (!focusNextInput(milkIds, target.id)) saveMilk();
                return;
            }

            if (target.id === 'poop-time') {
                savePoop();
                return;
            }

            if (target.id === 'supplement-time') {
                saveSupplement();
                return;
            }

            const sleepIds = ['sleep-start-time', 'sleep-end-time'];
            if (sleepIds.includes(target.id)) {
                if (!focusNextInput(sleepIds, target.id)) saveSleep();
            }
        }

        function setDefaultTimes() {
            const today = new Date().toLocaleDateString();
            const current = viewDate.toLocaleDateString();
            let timeStr = "00:00";
            if (today === current) {
                timeStr = new Date().toTimeString().slice(0, 5);
            }
            document.querySelectorAll('.manual-time-input').forEach(input => {
                input.value = timeStr;
            });
        }

        function setMilkType(t) {
            curMilkType = t;
            document.getElementById('milk-type-breast').classList.toggle('active-yellow', t === '瓶喂母乳');
            document.getElementById('milk-type-formula').classList.toggle('active-yellow', t === '配方奶');
        }

        function setPoopType(t) {
            curPoopType = t;
            document.querySelectorAll('#poop-type-group button').forEach(b => {
                b.classList.toggle('active-green', b.innerText === t);
            });
        }

        function getSupplementRecords() {
            return records.filter(r => r.cat === '补剂').sort((a, b) => b.id - a.id);
        }

        function getRecommendedSupplement() {
            const latest = getSupplementRecords()[0];
            if (!latest) return 'AD';
            return latest.type === 'AD' ? 'D3' : 'AD';
        }

        function setSupplementType(type) {
            curSupplementType = type;
            document.getElementById('supplement-type-ad').classList.toggle('active-yellow', type === 'AD');
            document.getElementById('supplement-type-d3').classList.toggle('active-yellow', type === 'D3');
        }

        function syncSupplementUI() {
            const targetDate = viewDate.toLocaleDateString();
            const todaySupplement = records.find(r => r.date === targetDate && r.cat === '补剂');
            const suggested = todaySupplement ? todaySupplement.type : getRecommendedSupplement();
            document.getElementById('supplement-hint').innerText = todaySupplement
                ? `今日已记录 ${todaySupplement.type}`
                : `建议今日补剂：${suggested}`;
            setSupplementType(suggested);
        }

        function getCategorySummary(cat, recs) {
            if (cat === '喝奶') {
                const totalMilk = recs.reduce((sum, record) => sum + (record.raw || 0), 0);
                return `${recs.length}次 · ${totalMilk}ml`;
            }
            if (cat === '排泄') {
                const peeCount = recs.filter(record => record.type.includes('尿尿')).length;
                const poopCount = recs.filter(record => record.type.includes('便便')).length;
                return `尿尿 ${peeCount}次 · 便便 ${poopCount}次`;
            }
            if (cat === '睡眠') {
                const totalSleep = recs.reduce((sum, record) => sum + (record.raw || 0), 0).toFixed(1);
                return `${recs.length}段 · ${totalSleep}h`;
            }
            if (cat === '补剂') {
                const latest = recs[recs.length - 1];
                return latest ? `已记录 ${latest.type}` : `${recs.length}次`;
            }
            return `${recs.length}条`;
        }

        function toggleCategoryCollapse(cat) {
            const targetDate = viewDate.toLocaleDateString();
            if (!collapsedCategories[targetDate]) {
                collapsedCategories[targetDate] = {};

        function saveSleep() {

        function parseRecordDate(dateStr) {
            const date = new Date(dateStr);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function startOfWeek(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            d.setDate(d.getDate() + diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function startOfQuarter(date) {
            return new Date(date.getFullYear(), Math.floor(date.getMonth() / 3) * 3, 1);
        }

        function formatBucketLabel(range, start, end) {
            if (range === 'day') return `${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')}`;
            if (range === 'week') return `${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')}`;
            if (range === 'month') return `${start.getFullYear()}.${String(start.getMonth() + 1).padStart(2, '0')}`;
            if (range === 'quarter') return `${start.getFullYear()} Q${Math.floor(start.getMonth() / 3) + 1}`;
            return `${start.getFullYear()}`;
        }

        function getAnalysisConfig(range) {
            if (range === 'week') return { count: 8, title: '趋势对比 (近8周)', table: '每周统计数据', firstCol: '周', key: 'week' };
            if (range === 'month') return { count: 6, title: '趋势对比 (近6个月)', table: '每月统计数据', firstCol: '月', key: 'month' };
            if (range === 'quarter') return { count: 4, title: '趋势对比 (近4个季度)', table: '每季度统计数据', firstCol: '季度', key: 'quarter' };
            if (range === 'year') return { count: 5, title: '趋势对比 (近5年)', table: '每年统计数据', firstCol: '年份', key: 'year' };
            return { count: 7, title: '趋势对比 (近7天)', table: '每日统计数据', firstCol: '日期', key: 'day' };
        }

        function buildAnalysisBuckets(range) {
            const now = new Date();
            const config = getAnalysisConfig(range);
            const buckets = [];

            for (let i = config.count - 1; i >= 0; i--) {
                let start;
                let end;

                if (range === 'week') {
                    start = startOfWeek(now);
                    start.setDate(start.getDate() - i * 7);
                    end = new Date(start);
                    end.setDate(end.getDate() + 7);
                } else if (range === 'month') {
                    start = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    end = new Date(now.getFullYear(), now.getMonth() - i + 1, 1);
                } else if (range === 'quarter') {
                    const quarterStart = startOfQuarter(now);
                    start = new Date(quarterStart.getFullYear(), quarterStart.getMonth() - i * 3, 1);
                    end = new Date(start.getFullYear(), start.getMonth() + 3, 1);
                } else if (range === 'year') {
                    start = new Date(now.getFullYear() - i, 0, 1);
                    end = new Date(now.getFullYear() - i + 1, 0, 1);
                } else {
                    start = new Date(now);
                    start.setHours(0, 0, 0, 0);
                    start.setDate(start.getDate() - i);
                    end = new Date(start);
                    end.setDate(end.getDate() + 1);
                }

                buckets.push({
                    label: formatBucketLabel(range, start, end),
                    start,
                    end,
                    milk: 0,
                    sleep: 0,
                    poop: 0
                });
            }

            records.forEach(record => {
                const date = parseRecordDate(record.date);
                if (!date) return;
                date.setHours(0, 0, 0, 0);
                const bucket = buckets.find(item => date >= item.start && date < item.end);
                if (!bucket) return;
                if (record.cat === '喝奶') bucket.milk += (record.raw || 0);
                if (record.cat === '睡眠') bucket.sleep += (record.raw || 0);
                if (record.cat === '排泄' && record.type.includes('便便')) bucket.poop += 1;
            });

            return { config, buckets };
        }

        function renderAnalysis() {
            const { config, buckets } = buildAnalysisBuckets(analysisRange);
            document.getElementById('analysis-title').innerText = config.title;
            document.getElementById('analysis-table-caption').innerText = config.table;
            document.getElementById('analysis-first-col').innerText = config.firstCol;
            document.getElementById('analysis-chart-caption').innerText = '奶量 & 睡眠 (ml / h)';

            ['day', 'week', 'month', 'quarter', 'year'].forEach(range => {
                document.getElementById(`analysis-range-${range}`).classList.toggle('active-yellow', range === analysisRange);
            });

            const milkStats = buckets.map(item => item.milk);
            const sleepStats = buckets.map(item => item.sleep);
            const maxMilk = Math.max(...milkStats, 100);
            const maxSleep = Math.max(...sleepStats, 12);

            const container = document.getElementById('mixed-chart-container');
            const w = Math.max(container.clientWidth - 32, 240);
            const h = 140;
            const groupWidth = w / buckets.length;
            const barWidth = Math.min(Math.max(groupWidth * 0.24, 10), 22);
            const gap = Math.max(groupWidth * 0.08, 4);

            container.innerHTML = `
                <svg class="w-full h-full overflow-visible">
                    <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#e2e8f0" stroke-width="1" />
                    ${buckets.map((item, i) => `
                        <rect
                            x="${i * groupWidth + (groupWidth - barWidth * 2 - gap) / 2}"
                            y="${h - (item.milk / maxMilk) * h}"
                            width="${barWidth}"
                            height="${Math.max((item.milk / maxMilk) * h, 2)}"
                            rx="4"
                            fill="#fbbf24"
                            opacity="0.85"
                        />
                        <rect
                            x="${i * groupWidth + (groupWidth - barWidth * 2 - gap) / 2 + barWidth + gap}"
                            y="${h - (item.sleep / maxSleep) * h}"
                            width="${barWidth}"
                            height="${Math.max((item.sleep / maxSleep) * h, 2)}"
                            rx="4"
                            fill="#38bdf8"
                            opacity="0.9"
                        />
                        <text x="${i * groupWidth + groupWidth / 2}" y="${h + 20}" text-anchor="middle" class="text-[8px] fill-slate-300 font-bold">${item.label}</text>
                    `).join('')}
                </svg>
            `;

            const tbody = document.getElementById('analysis-table-body');
            tbody.innerHTML = [...buckets].reverse().map(item => `
                <tr>
                    <td>${item.label}</td>
                    <td class="text-amber-600 font-black">${item.milk}ml</td>
                    <td class="text-emerald-600 font-black">${item.poop}次</td>
                    <td class="text-sky-600 font-black">${item.sleep.toFixed(1)}h</td>
                </tr>
            `).join('');
        }

        function setAnalysisRange(range) {
            analysisRange = range;
            renderAnalysis();
        }

        function csvEscape(value) {
            if (value === null || value === undefined) return '';
            const text = String(value);
            return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        }

        function parseCsv(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const next = text[i + 1];

                if (char === '"') {
                    if (inQuotes && next === '"') {
                        cell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(cell);
                    cell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && next === '\n') i++;
                    row.push(cell);
                    if (row.some(value => value !== '')) rows.push(row);
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }

            row.push(cell);
            if (row.some(value => value !== '')) rows.push(row);
            return rows;
        }

        function recordToCsvRow(r) {
            return [
                r.id,
                r.date,
                r.cat,
                r.type,
                r.val,
                r.raw,
                r.icons?.[0] || '',
                r.color,
                r.time,
                r.meta?.start || '',
                r.meta?.end || '',
                r.meta?.volume || '',
                r.meta?.cross ? 'true' : 'false',
                r.meta?.time || ''
            ];
        }

        function csvRowToRecord(headers, row) {
            const data = {};
            headers.forEach((header, index) => data[header] = row[index] || '');
            const raw = parseFloat(data.raw);
            const meta = {};

            if (data.meta_start) meta.start = data.meta_start;
            if (data.meta_end) meta.end = data.meta_end;
            if (data.meta_volume) meta.volume = parseInt(data.meta_volume);
            if (data.meta_cross) meta.cross = data.meta_cross.toLowerCase() === 'true';
            if (data.meta_time) meta.time = data.meta_time;

            return {
                id: parseInt(data.id) || Date.now() + Math.floor(Math.random() * 100000),
                date: data.date,
                cat: data.cat,
                type: data.type,
                val: data.val,
                raw: Number.isFinite(raw) ? raw : 0,
                icons: [data.icon || 'circle'],
                color: data.color || 'slate',
                time: data.time,
                meta
            };
        }

        function exportData() {
            const headers = ['id', 'date', 'cat', 'type', 'val', 'raw', 'icon', 'color', 'time', 'meta_start', 'meta_end', 'meta_volume', 'meta_cross', 'meta_time'];
            const csv = [
                headers.join(','),
                ...records.map(record => recordToCsvRow(record).map(csvEscape).join(','))
            ].join('\n');
            const blob = new Blob(['\uFEFF' + csv], { type: "text/csv;charset=utf-8" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `baby_log_all.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importData(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if(!file) return;
            if(!confirm('上传 CSV 会替换当前所有本地记录，继续吗？')) return;

            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const text = String(reader.result || '').replace(/^\uFEFF/, '');
                    const rows = parseCsv(text);
                    if(rows.length < 2) throw new Error('empty');

                    const headers = rows[0].map(header => header.trim());
                    const requiredHeaders = ['id', 'date', 'cat', 'type', 'val', 'raw', 'icon', 'color', 'time'];
                    const hasRequiredHeaders = requiredHeaders.every(header => headers.includes(header));
                    if(!hasRequiredHeaders) throw new Error('headers');

                    const imported = rows.slice(1).map(row => csvRowToRecord(headers, row)).filter(record => record.date && record.cat);
                    if(!imported.length) throw new Error('records');

                    records = imported;
                    saveToStorage();
                    render();
                    showToast(`已上传 ${records.length} 条记录`);
                } catch (error) {
                    showToast('CSV 格式不正确');
                }
            };
            reader.readAsText(file, 'utf-8');
        }

        function clearAll() { if(confirm('确定清空所有数据？不可恢复。')) { records = []; saveToStorage(); render(); } }
        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m;
            t.style.opacity = '1'; t.style.transform = 'translateY(0) translateX(-50%)';
            setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(4px) translateX(-50%)'; }, 2000);
        }

        window.onload = () => {
            updateDateUI();
            setDefaultTimes();
            render();
            bindInputInteractions();
            document.addEventListener('keydown', handleEnterSubmit);
        };
    </script>
</body>
</html>
